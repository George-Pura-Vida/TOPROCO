kt","controller":"Projekt TOPROCO pripravuje Jiří Janoušek. Pred komerčným spustením treba doplniť úplné identifikačné údaje, kontaktnú adresu a zoznam sprostredkovateľov.","rightsTitle":"5. Vaše práva","rights":"Podľa uplatniteľného práva máte práva na informácie, prístup, opravu, výmaz, obmedzenie, prenosnosť a námietku alebo odvolanie súhlasu. Ich rozsah závisí od spracúvania.","lawsTitle":"6. Pravidlá podľa krajiny","eu":"EÚ / ČR: GDPR a pravidlá elektronických komunikácií; nepovinné cookies vyžadujú súhlas.","uk":"Spojené kráľovstvo: UK GDPR a PECR vyžadujú súhlas s nevyňatým sledovaním.","es":"Španielsko: AEPD žiada rovnako viditeľné prijať a odmietnuť.","us":"USA: pravidlá sa líšia podľa štátu. Niektoré poskytujú právo odmietnuť predaj a zdieľanie údajov.","cn":"Čína: PIPL vyžaduje právny základ, informovanie a pri určených činnostiach osobitný súhlas.","marketingTitle":"7. Marketing a správy","marketing":"Súhlas s cookies nie je súhlas so zasielaním marketingových e-mailov alebo SMS. Treba samostatné pravidlá a možnosť odhlásiť sa.","noticeTitle":"Pred komerčným spustením","notice":"Toto je pracovná informácia pre pilotný web, nie úplný globálny právny audit. Ďalšie integrácie potrebujú odborné posúdenie.","home":"← Späť na TOPROCO","contact":"Kontaktovať iniciátora","sources":"Oficiálne zdroje","locale":"Jazyk"},"en":{"title":"Privacy and cookies","subtitle":"Information on the current TOPROCO pilot landing page. Updated 6 November 2026.","introTitle":"1. What this site uses","intro":"This version does not install Google Analytics, advertising pixels or visitor tracking cookies. This page describes only the TOPROCO landing page, not the four separate applications.","storeTitle":"2. Browser storage","storeA":"toproco-language – stores the language you actively select.","storeB":"toproco-privacy-notice-v1 – records dismissal of the privacy information notice.","storeC":"Neither value is an advertising or analytics identifier. You can clear them through your browser.","logsTitle":"3. Server access logs","logs":"Hosting infrastructure may process IP addresses and technical request logs. Their scope, provider, purposes and retention need verification before full commercial launch.","controllerTitle":"4. Operator and contact","controller":"The TOPROCO project is being developed by Jiří Janoušek. Full controller identification, a privacy contact address and processor details must be completed before a commercial launch.","rightsTitle":"5. Your rights","rights":"Depending on the law and processing activity, you may have rights to information, access, correction, deletion, restriction, portability, objection and consent withdrawal. No registration data is processed by this landing page.","lawsTitle":"6. Jurisdictional overview","eu":"EU / Czech Republic: GDPR and electronic communications rules generally require prior consent for non-essential tracking.","uk":"United Kingdom: UK GDPR and PECR generally require consent for non-exempt storage or access technologies.","es":"Spain: AEPD requires equally visible accept and reject options for optional cookies.","us":"United States: obligations vary by state. Certain states provide opt-out rights regarding sale or sharing. California recognizes opt-out preference signals.","cn":"China: PIPL requires an appropriate processing basis and notice, with separate consent in specific situations, including certain cross-border transfers.","marketingTitle":"7. Email, SMS and marketing","marketing":"Cookie consent is not consent to marketing messages. Newsletters, SMS campaigns and CRM outreach require their own lawful basis, controls and unsubscribe mechanisms.","noticeTitle":"Before full launch","notice":"This is a transparent pilot-site notice, not comprehensive legal advice or a globally certified compliance policy. Commercial tracking, AI services and payment or bank integrations need proper legal and security reviews.","home":"← Back to TOPROCO","contact":"Contact project initiator","sources":"Official guidance","locale":"Language"},"es":{"title":"Privacidad y cookies","subtitle":"Información sobre la página piloto TOPROCO. Actualizado: 6 de noviembre de 2026.","introTitle":"1. Qué utiliza esta web","intro":"Esta versión no instala Google Analytics, píxeles publicitarios ni cookies de seguimiento. La información solo afecta a esta página, no a las cuatro aplicaciones independientes.","storeTitle":"2. Almacenamiento del navegador","storeA":"toproco-language – guarda el idioma seleccionado expresamente.","storeB":"toproco-privacy-notice-v1 – recuerda que se ha cerrado el aviso informativo.","storeC":"Ninguna de estas claves sirve para publicidad o analítica. Puedes eliminarlas desde el navegador.","logsTitle":"3. Registros del servidor","logs":"El proveedor de alojamiento puede tratar direcciones IP y datos técnicos. Antes de la actividad comercial se deben verificar el alcance, los plazos y los responsables.","controllerTitle":"4. Responsable y contacto","controller":"TOPROCO está siendo desarrollado por Jiří Janoušek. Antes del lanzamiento comercial se completarán los datos legales, la dirección de privacidad y los encargados del tratamiento.","rightsTitle":"5. Derechos","rights":"Según la legislación aplicable, puedes solicitar información, acceso, rectificación, supresión, limitación, portabilidad, oposición o retirar tu consentimiento. Esta página no procesa registros de usuarios.","lawsTitle":"6. Normativa por región","eu":"UE / República Checa: RGPD y normativa de comunicaciones electrónicas; el seguimiento no esencial requiere consentimiento.","uk":"Reino Unido: UK GDPR y PECR requieren consentimiento para tecnologías no exentas.","es":"España: la AEPD exige aceptar y rechazar al mismo nivel y con igual visibilidad.","us":"EE. UU.: las obligaciones varían por estado. Algunos reconocen el derecho de oposición a la venta o al intercambio de datos; California reconoce señales de exclusión.","cn":"China: la PIPL exige una base jurídica, información y, en ciertos supuestos, consentimiento separado para transferencias internacionales.","marketingTitle":"7. Marketing, correo y SMS","marketing":"Aceptar cookies no implica aceptar mensajes comerciales. Las campañas de correo, SMS y CRM necesitan bases jurídicas y mecanismos de baja independientes.","noticeTitle":"Antes del lanzamiento comercial","notice":"Este es un aviso para la web piloto, no una certificación jurídica global. Las nuevas integraciones requieren revisión legal y de seguridad.","home":"← Volver a TOPROCO","contact":"Contactar con el promotor","sources":"Fuentes oficiales","locale":"Idioma"},"zh":{"title":"隐私与 Cookie","subtitle":"TOPROCO 试点网站隐私信息（2026 年 11 月 6 日更新）。","introTitle":"1. 网站当前使用的技术","intro":"本页面目前未安装 Google Analytics、广告像素或访客跟踪 Cookie。本说明仅适用于 TOPROCO 主页，不包含四款独立应用。","storeTitle":"2. 浏览器本地存储","storeA":"toproco-language：仅在您主动选择语言后保存该选择。","storeB":"toproco-privacy-notice-v1：记录您已关闭隐私提示。","storeC":"上述数据不用于广告或分析，可在浏览器设置中清除。","logsTitle":"3. 服务器访问日志","logs":"托管服务可能处理 IP 地址及技术请求日志。正式商业运营前须核实处理者、目的、范围及保存期限。","controllerTitle":"4. 运营者及联系方式","controller":"TOPROCO 项目由 Jiří Janoušek 筹备。商业运营前仍需补充完整的个人信息处理者资料、隐私联系渠道及服务商清单。","rightsTitle":"5. 您的权利","rights":"依据适用法律和处理行为，您可能享有知情、查阅、更正、删除、限制处理、数据转移、拒绝处理和撤回同意的权利。本主页目前不处理用户注册资料。","lawsTitle":"6. 各地区法律概览","eu":"欧盟及捷克：GDPR 和电子通信法规通常要求在启用非必要追踪前获得同意。","uk":"英国：UK GDPR 与 PECR 通常要求对非豁免追踪技术获得同意。","es":"西班牙：AEPD 要求接受和拒绝可选 Cookie 的入口同样醒目。","us":"美国：各州规定不同；部分州要求提供拒绝出售或共享个人信息的权利，加州承认退出偏好信号。","cn":"中国：个人信息保护法要求适当法律依据、透明告知，并在特定情形下取得单独同意，包括部分跨境提供行为。","marketingTitle":"7. 营销邮件与短信","marketing":"Cookie 同意不等同于接收营销邮件或短信的同意。推广活动需要独立的法律依据和退订机制。","noticeTitle":"正式运营之前","notice":"本说明仅针对试点主页，并非完整的全球法律合规认证。商业营销、AI、银行及支付集成需进一步法律和安全评估。","home":"← 返回 TOPROCO","contact":"联系项目发起人","sources":"官方资料","locale":"语言"}};const sel=document.getElementById('lang');function showPrivacyLang(l){const code=i18n[l]?l:'cs';document.documentElement.lang=code;sel.value=code;document.querySelectorAll('[data-k]').forEach(el=>{if(i18n[code][el.dataset.k])el.textContent=i18n[code][el.dataset.k]});document.getElementById('locale-label').textContent=i18n[code].locale;}let saved='cs';try{saved=localStorage.getItem('toproco-language')||'cs'}catch(e){}showPrivacyLang(saved);sel.addEventListener('change',()=>{showPrivacyLang(sel.value);try{localStorage.setItem('toproco-language',sel.value)}catch(e){}});</script></body></html>
