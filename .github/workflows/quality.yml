name: TOPROCO site quality
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript and markup smoke tests
        run: node --test tests/site.test.mjs
      - name: Install headless browser test dependency
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop, tablet and mobile interfaces
        run: node tests/browser.mjs
      - name: Attach screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toproco-browser-previews
          path: |
            toproco-mobile.png
            toproco-desktop.png
          if-no-files-found: ignore
      - name: Validate self-hosted vector artwork
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          for file in Path('assets').glob('*.svg'):
              ElementTree.parse(file)
              print('Valid SVG:',file)
          PY
